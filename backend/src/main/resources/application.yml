server:
  port: ${APP_PORT:8080}
  tomcat:
    max-swallow-size: ${TOMCAT_MAX_SWALLOW_SIZE:-1}

spring:
  application:
    name: video-site-backend
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:1024MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:1024MB}
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:video_site}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    locations: classpath:db/migration
    clean-disabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  storage:
    local-root: ${LOCAL_STORAGE_ROOT:../}
  transcode:
    ffmpeg-bin: ffmpeg.exe
    worker-cron: ${TRANSCODE_WORKER_CRON:0/10 * * * * ?}
    batch-size: ${TRANSCODE_WORKER_BATCH_SIZE:1}
    max-retry: ${TRANSCODE_MAX_RETRY:3}
  cover-analysis:
    worker-cron: ${COVER_ANALYSIS_WORKER_CRON:0/20 * * * * ?}
  cover-auto:
    enabled: ${COVER_AUTO_ENABLED:true}
    snapshot-second: ${COVER_AUTO_SNAPSHOT_SECOND:3}
    external-title-enabled: ${COVER_AUTO_EXTERNAL_TITLE_ENABLED:true}
  recommend:
    worker-cron: ${RECOMMEND_WORKER_CRON:0 5 * * * ?}
    reason-enabled: true
  hot-rank:
    worker-cron: ${HOT_RANK_WORKER_CRON:15 0/5 * * * ?}
    top-n: ${HOT_RANK_TOP_N:50}
  llm:
    provider: ${LLM_PROVIDER:kimi}
    api-key: ${KIMI_API_KEY:}
    base-url: ${LLM_BASE_URL:https://api.kimi.com/coding}
    model: ${LLM_MODEL:kimi-k2.6}
    protocol: ${LLM_PROTOCOL:anthropic}
    timeout-seconds: 60
  intelligence:
    enabled: ${INTELLIGENCE_ENABLED:true}
    worker-cron: ${INTELLIGENCE_WORKER_CRON:0/30 * * * * ?}
    audio:
      provider: ${AUDIO_PROVIDER:whisper}
      whisper-model: ${WHISPER_MODEL:small}
      whisper-script: ${WHISPER_SCRIPT:../scripts/transcribe.py}
      max-duration-sec: 600
    frame:
      enabled: true
      count: 3
      scale-width: 480
